[package]
name = "ai_agent_app"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
rdkafka = { version = "0.39.0", features = ["cmake-build"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "limit"] }
uuid = { version = "1.27.0", features = ["v4"] }
